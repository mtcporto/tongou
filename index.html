    <script>
        // --- ELEMENTOS DA UI ---

        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        const logDiv = document.getElementById('logs');
        const deviceModal = document.getElementById('device-modal');
        const modalDeviceName = document.getElementById('modal-device-name');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const geminiAnalyzeBtn = document.getElementById('gemini-analyze-btn');
        const geminiAnalysisContainer = document.getElementById('gemini-analysis-container');
        const geminiLoader = document.getElementById('gemini-loader');
        const geminiAnalysisResult = document.getElementById('gemini-analysis-result');
        const useProxyCheckbox = document.getElementById('use-proxy');
        const debugInfo = document.getElementById('debug-info');
        
        let currentDeviceStatusForAI = null;
        let scheduledCommands = new Map(); // Armazenar agendamentos ativos
        let currentDeviceId = null; // Armazenar ID do dispositivo atual

        // --- CONFIGURAÇÕES DA API ---
        let config = {
            clientId: '',
            clientSecret: '',
            baseUrl: '',
            userId: '',
            accessToken: '',
            refreshToken: '',
            uid: ''
        };


        // --- FUNÇÕES DE LOG ---
        function log(message, data) {
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong class="text-green-400">[${time}]</strong> ${message}`;
            if (data) {
                const dataStr = JSON.stringify(data, null, 2);
                const pre = document.createElement('pre');
                pre.className = 'bg-gray-800 p-2 rounded-md mt-1 text-yellow-300';
                pre.textContent = dataStr;
                logEntry.appendChild(pre);
            }
            logDiv.prepend(logEntry);
        }

        function logError(message, error) {
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<strong class="text-red-500">[${time}]</strong> ${message}`;
            if (error) {
                const dataStr = JSON.stringify(error, Object.getOwnPropertyNames(error), 2);
                const pre = document.createElement('pre');
                pre.className = 'bg-gray-800 p-2 rounded-md mt-1 text-red-400';
                pre.textContent = dataStr;
                logEntry.appendChild(pre);
            }
            logDiv.prepend(logEntry);
        }

        // --- LÓGICA DA API (GEMINI) ---
        async function callGeminiAPI(deviceStatus) {
            if (!document.getElementById("gemini-api-key").value.trim()) {
                alert("Informe sua chave Gemini para usar a análise de IA.");
                return;
            }
            log("Chamando a API do Gemini para análise...");
            geminiLoader.classList.remove('hidden');
            geminiAnalysisResult.classList.add('hidden');

            const isOffline = !deviceStatus.find(s => s.code === 'online')?.value;
            const hasAlarms = deviceStatus.some(s => s.code.includes('alarm') && s.value);
            const switchState = deviceStatus.find(s => s.code === 'switch')?.value;
            const currentPower = deviceStatus.find(s => s.code === 'cur_power')?.value;
            const currentVoltage = deviceStatus.find(s => s.code === 'cur_voltage')?.value;
            const currentCurrent = deviceStatus.find(s => s.code === 'cur_current')?.value;
            const totalEnergy = deviceStatus.find(s => s.code === 'total_forward_energy' || s.code === 'forward_energy_total')?.value;
            const temperature = deviceStatus.find(s => s.code === 'temp_current')?.value;
            const childLock = deviceStatus.find(s => s.code === 'child_lock')?.value;
            const timer = deviceStatus.find(s => s.code === 'countdown_1')?.value;
            
            let prompt;
            if (isOffline || hasAlarms) {
                prompt = `🏨 RELATÓRIO DE MANUTENÇÃO - DISJUNTOR INTELIGENTE 🏨

Você é um assistente de engenharia elétrica especializado em manutenção de instalações hoteleiras. Um disjuntor inteligente em um quarto de hotel está apresentando problemas.

DADOS DO DISPOSITIVO:
${JSON.stringify(deviceStatus, null, 2)}

Por favor, forneça:
1. 🔍 DIAGNÓSTICO: Identifique o problema principal
2. ⚠️ NÍVEL DE PRIORIDADE: Baixa/Média/Alta/Crítica
3. 🛠️ AÇÕES IMEDIATAS: O que fazer agora
4. 📋 GUIA PASSO A PASSO: Solução detalhada para técnico
5. 🏨 IMPACTO NO HÓSPEDE: Como isso afeta a experiência
6. 🔒 SEGURANÇA: Precauções importantes

Priorize sempre a segurança e a experiência do hóspede.`;
            } else {
                const energyInfo = currentPower !== undefined || totalEnergy !== undefined ? 
                    `\n📊 DADOS DE ENERGIA DISPONÍVEIS:
- Potência atual: ${currentPower ? (currentPower/10).toFixed(1) + ' W' : 'N/A'}
- Tensão: ${currentVoltage ? (currentVoltage/10).toFixed(1) + ' V' : 'N/A'}
- Corrente: ${currentCurrent ? currentCurrent + ' mA' : 'N/A'}
- Energia total: ${totalEnergy ? (totalEnergy/1000).toFixed(3) + ' kWh' : 'N/A'}
- Temperatura: ${temperature ? temperature + '°C' : 'N/A'}` : '';

                prompt = `🏨 RELATÓRIO GERENCIAL - DISJUNTOR INTELIGENTE 🏨

Você é um assistente especializado em gerenciamento de energia para hotéis. Analise os dados deste disjuntor de quarto de hotel e forneça um relatório executivo.

ESTADO ATUAL:
- Disjuntor: ${switchState ? '✅ LIGADO' : '❌ DESLIGADO'}
- Trava de segurança: ${childLock ? '🔒 ATIVADA' : '🔓 DESATIVADA'}
- Timer: ${timer > 0 ? `⏰ ${Math.floor(timer/60)}min ${timer%60}s` : '❌ Inativo'}${energyInfo}

DADOS COMPLETOS:
${JSON.stringify(deviceStatus, null, 2)}

Por favor, forneça:
1. 📈 RESUMO EXECUTIVO: Status geral em linguagem simples
2. ⚡ ANÁLISE DE CONSUMO: Interpretação dos dados de energia (se disponíveis)
3. 💰 IMPACTO FINANCEIRO: Estimativa de custos de energia
4. 🎯 RECOMENDAÇÕES: Otimizações para economizar energia
5. 🏨 GESTÃO HOTELEIRA: Como usar estes dados para melhor operação
6. ⚠️ ALERTAS: Qualquer situação que precise atenção

Foque na economia de energia e experiência do hóspede.`;
            }

            const apiKey = document.getElementById("gemini-api-key").value.trim();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{
                    parts: [{ text: prompt }]
                }],
                generationConfig: {
                    temperature: 0.7,
                    topK: 40,
                    topP: 0.95,
                    maxOutputTokens: 2048,
                }
            };

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Erro na API do Gemini: ${response.statusText}`);
                }

                const result = await response.json();
                const text = result.candidates[0].content.parts[0].text;
                
                geminiAnalysisResult.textContent = text;
                geminiAnalysisResult.classList.add("whitespace-pre-wrap");
                log("Análise do Gemini recebida com sucesso.");

            } catch (error) {
                logError("Erro ao chamar a API do Gemini", error);
                geminiAnalysisResult.innerHTML = `<div class="text-red-500">❌ Não foi possível obter a análise da IA. 
                
Possíveis causas:
• Chave da API inválida
• Limite de requisições excedido
• Problema de conectividade

Verifique os logs para mais detalhes.</div>`;
            } finally {
                geminiLoader.classList.add('hidden');
                geminiAnalysisResult.classList.remove('hidden');
            }
        }

        // --- LÓGICA DA API (TUYA) ---
        class TongouAPI {
            constructor(apiConfig, useProxy = true) {
                this.config = apiConfig;
                this.useProxy = useProxy;
                this.proxyUrl = 'https://tongou.mosaicoworkers.workers.dev/';
                if (useProxy) {
                    log("API iniciada com proxy CORS");
                } else {
                    log("API iniciada sem proxy (pode ter problemas de CORS)");
                }
            }
            
            _getSign(timestamp, method, path, params = {}, body = null) {
                let stringToSign = method + '\n';
                let contentHash = CryptoJS.SHA256(body ? JSON.stringify(body) : '');
                stringToSign += contentHash + '\n\n';
                const url = new URL(this.config.baseUrl + path);
                url.search = new URLSearchParams(params).toString();
                stringToSign += url.pathname + url.search;
                const tokenStr = this.config.accessToken ? this.config.accessToken : "";
                const signStr = this.config.clientId + tokenStr + timestamp + stringToSign;
                return CryptoJS.HmacSHA256(signStr, this.config.clientSecret).toString(CryptoJS.enc.Hex).toUpperCase();
            }

            async _request(method, path, params = {}, body = null) {
                const timestamp = new Date().getTime();
                const url = new URL(this.config.baseUrl + path);
                url.search = new URLSearchParams(params).toString();
                
                const headers = {
                    'client_id': this.config.clientId,
                    't': timestamp,
                    'sign_method': 'HMAC-SHA256',
                    'lang': 'en',
                    'Content-Type': 'application/json'
                };
                
                const isTokenRequest = path.includes('/v1.0/token');
                if (this.config.accessToken && !isTokenRequest) {
                    headers['access_token'] = this.config.accessToken;
                }
                headers['sign'] = this._getSign(timestamp, method, path, params, body);
                
                // Decidir se usar proxy ou fazer requisição direta
                let finalUrl, fetchHeaders;
                if (this.useProxy) {
                    // Use proxy para evitar CORS
                    finalUrl = `${this.proxyUrl}?url=${encodeURIComponent(url.toString())}`;
                    fetchHeaders = headers;
                    log(`Enviando requisição ${method} para ${url.pathname}${url.search} via proxy`);
                } else {
                    // Requisição direta (pode ter problemas de CORS)
                    finalUrl = url.toString();
                    fetchHeaders = headers;
                    log(`Enviando requisição ${method} para ${url.pathname}${url.search} diretamente`);
                }
                
                try {
                    const response = await fetch(finalUrl, {
                        method,
                        headers: fetchHeaders,
                        body: body ? JSON.stringify(body) : null
                    });
                    
                    const data = await response.json();
                    log(`Response status: ${response.status}`, { data });
                    
                    if (!data.success) {
                        const errorMsg = data.msg || `API Error Code: ${data.code}`;
                        log(`API retornou erro: ${errorMsg}`, data);
                        throw new Error(errorMsg);
                    }
                    log(`Resposta recebida com sucesso de ${path}`, data.result);
                    return data.result;
                } catch (error) {
                    logError(`ERRO na requisição para ${path}`, error);
                    throw error;
                }
            }

            async getToken() {
                log("Obtendo Access Token...");
                const result = await this._request('GET', '/v1.0/token', { grant_type: 1 });
                if (result && result.access_token) {
                    this.config.accessToken = result.access_token;
                    this.config.refreshToken = result.refresh_token;
                    this.config.uid = result.uid;
                    log("Access Token obtido com sucesso!");
                    return true;
                }
                throw new Error("Falha ao obter o Access Token.");
            }

            async getAssets() {
                // Tentar diretamente com o dispositivo conhecido
                const knownDeviceId = 'eb4995d7b51c09a5e7058p';
                log(`Carregando dispositivo: ${knownDeviceId}`);
                
                try {
                    const status = await this.getDeviceStatus(knownDeviceId);
                    log(`Dispositivo carregado com sucesso`);
                    
                    // Retornar como um asset
                    return [{
                        asset_id: `asset_${knownDeviceId}`,
                        name: 'Quarto 101',
                        device_id: knownDeviceId
                    }];
                } catch (error) {
                    log(`Falha ao acessar dispositivo: ${error.message}`);
                    return [];
                }
            }

            async getDevices(assetId) {
                // Se o asset tem um device_id específico, retornar esse dispositivo
                if (assetId.startsWith('asset_')) {
                    const deviceId = assetId.replace('asset_', '');
                    try {
                        const deviceStatus = await this.getDeviceStatus(deviceId);
                        return [{
                            id: deviceId,
                            name: `Disjuntor A`,
                            online: true, // Assumir online se conseguimos obter status
                            status: deviceStatus
                        }];
                    } catch (error) {
                        log(`Erro ao obter status do dispositivo ${deviceId}: ${error.message}`);
                        return [];
                    }
                }
                
                return [];
            }

            async sendCommand(deviceId, code, value) {
                log(`Enviando comando: ${code}=${value} para dispositivo ${deviceId}`);
                const body = { 'commands': [{ 'code': code, 'value': value }] };
                
                try {
                    const result = await this._request('POST', `/v1.0/devices/${deviceId}/commands`, {}, body);
                    log(`Comando enviado com sucesso`);
                    return result || true;
                } catch (error) {
                    log(`Erro ao enviar comando: ${error.message}`);
                    throw error;
                }
            }
            
            async getDeviceStatus(deviceId) {
                 try {
                     const result = await this._request('GET', `/v1.0/devices/${deviceId}/status`);
                     if (result && Array.isArray(result)) {
                         return result;
                     }
                 } catch (error) {
                     log(`Falha ao obter status: ${error.message}`);
                     throw error;
                 }
                 
                 // Retornar status padrão se não conseguir obter
                 return [
                     { code: 'switch', value: false },
                     { code: 'online', value: true }
                 ];
            }
        }

        let api;

        // --- LÓGICA DA APLICAÇÃO ---
        
        function updateDebugInfo(info) {
            if (debugInfo) {
                debugInfo.innerHTML += `<div class="mb-1">${info}</div>`;

        function toggleLoading(isLoading) {
            connectBtn.disabled = isLoading;
            connectBtn.classList.toggle('loading', isLoading);
            btnText.classList.toggle('hidden', isLoading);
            btnLoader.classList.toggle('hidden', !isLoading);
        }

        connectBtn.addEventListener('click', async () => {
            config.clientId = document.getElementById('clientId').value;
            config.clientSecret = document.getElementById('clientSecret').value;
            config.baseUrl = document.getElementById('region').value;
            config.userId = document.getElementById('userId').value; // This is the App UID

            if (!config.clientId || !config.clientSecret || !config.userId) {
                alert('Por favor, preencha o Client ID, Client Secret e o User ID (App UID).');
                return;
            }

            toggleLoading(true);
            const useProxy = useProxyCheckbox.checked;
            api = new TongouAPI(config, useProxy);

            try {
                await api.getToken();
                log("Carregando dispositivos...");
                updateDebugInfo(`<i class="fas fa-check text-green-600"></i> Token obtido: ${api.config.accessToken.substring(0, 8)}...`);
                updateDebugInfo(`<i class="fas fa-user text-blue-600"></i> UID: ${api.config.uid}`);
                
                const assets = await api.getAssets();
                updateDebugInfo(`<i class="fas fa-home text-purple-600"></i> Dispositivos encontrados: ${assets.length}`);
                
                authSection.classList.add('hidden');
                mainContent.classList.remove('hidden');
                
                if (assets && assets.length > 0) {
                    updateDebugInfo(`<i class="fas fa-cogs text-orange-600"></i> Renderizando ${assets.length} dispositivos...`);
                    await renderRooms(assets);
                } else {
                    log("Nenhum dispositivo encontrado.");
                    updateDebugInfo(`<i class="fas fa-exclamation-triangle text-red-600"></i> Nenhum dispositivo encontrado`);
                    roomsGrid.innerHTML = '<div class="col-span-full text-center p-8"><p class="text-gray-500">Nenhum dispositivo encontrado.</p><p class="text-sm text-gray-400 mt-2">Verifique se há dispositivos associados à sua conta.</p></div>';

                roomsGrid.appendChild(roomCard);
                
                try {
                    const devices = await api.getDevices(asset.asset_id);
                    const devicesContainer = roomCard.querySelector('.devices-container');
                    devicesContainer.innerHTML = '';
                    if (devices && devices.length > 0) {

                    } else {
                        devicesContainer.innerHTML = '<p class="text-sm text-gray-500">Nenhum disjuntor neste quarto.</p>';

            const switchCode = switchStatus ? switchStatus.code : 'switch'; // Default para 'switch'

        async function handleToggleDevice(event) {
            const button = event.target;
            const deviceId = button.dataset.deviceId;
            const currentState = button.dataset.currentState === 'true';
            const switchCode = button.dataset.switchCode || 'switch'; // Usar o código correto do switch
            const newState = !currentState;
            
            log(`Tentando ${newState ? 'LIGAR' : 'DESLIGAR'} o dispositivo ${deviceId} usando código: ${switchCode}`);
            button.disabled = true;
            button.textContent = '...';
            
            try {
                const result = await api.sendCommand(deviceId, switchCode, newState);
                if (result === true || result) { // Aceitar qualquer resultado truthy
                    log(`Comando para ${newState ? 'LIGAR' : 'DESLIGAR'} enviado com sucesso.`);
                    updateDeviceUI(deviceId, newState);
                    
                    // Aguardar um pouco e verificar o status real do dispositivo
                    setTimeout(async () => {
                        try {
                            const status = await api.getDeviceStatus(deviceId);
                            const actualState = status.find(s => s.code === switchCode)?.value;
                            if (actualState !== undefined) {
                                updateDeviceUI(deviceId, actualState);
                                log(`Status real verificado: ${actualState ? 'LIGADO' : 'DESLIGADO'}`);
                            }
                        } catch (error) {
                            log(`Erro ao verificar status: ${error.message}`);
                        }
                    }, 2000); // Aguardar 2 segundos
                    
                } else { 
                    throw new Error('API não retornou sucesso.'); 
                }
            } catch (error) {
                logError(`Falha ao enviar comando para o dispositivo ${deviceId}`, error);
                alert(`Não foi possível alterar o estado do dispositivo: ${error.message}`);
                updateDeviceUI(deviceId, currentState);
            } finally {
                button.disabled = false;
            }
        }
        
        function updateDeviceUI(deviceId, isOn) {
            const button = document.querySelector(`#device-${deviceId} .btn-toggle`);
            if (button) {
                button.dataset.currentState = isOn;
                button.textContent = isOn ? 'LIGADO' : 'DESLIGADO';
                button.classList.toggle('on', isOn);
                button.classList.toggle('off', !isOn);
            }
        }

        function setupEnergyMonitoring(deviceId) {

        function updateEnergyMetrics(statusList) {
            const energyMetrics = document.getElementById('energy-metrics');
            if (!energyMetrics) return;
            
            const energyData = statusList.filter(s => 
                ['cur_current', 'cur_power', 'cur_voltage', 'total_forward_energy', 'forward_energy_total', 'temp_current'].includes(s.code)
            );
            
            // Limpar métricas existentes
            energyMetrics.innerHTML = '';
            
            energyData.forEach(energy => {
                let displayValue = String(energy.value);
                let unit = '';
                let icon = 'fas fa-info';
                let colorClass = 'text-gray-600';
                
                switch (energy.code) {
                    case 'cur_current':
                        displayValue = energy.value;
                        unit = 'mA';
                        icon = 'fas fa-tachometer-alt';
                        colorClass = 'text-blue-600';
                        break;
                    case 'cur_power':
                        displayValue = energy.value;
                        unit = 'W';
                        icon = 'fas fa-flash';
                        colorClass = 'text-purple-600';
                        break;
                    case 'cur_voltage':
                        displayValue = energy.value;
                        unit = 'V';
                        icon = 'fas fa-plug';
                        colorClass = 'text-orange-600';
                        break;
                    case 'total_forward_energy':
                    case 'forward_energy_total':
                        displayValue = (energy.value / 1000).toFixed(3);
                        unit = 'kWh';
                        icon = 'fas fa-chart-line';
                        colorClass = 'text-green-600';
                        break;
                    case 'temp_current':
                        displayValue = energy.value;
                        unit = '°C';
                        icon = 'fas fa-thermometer-half';
                        colorClass = energy.value > 60 ? 'text-red-600' : 'text-green-600';
                        break;
                }
                
                const descriptions = {
                    'cur_current': 'Corrente atual',
                    'cur_power': 'Potência atual',
                    'cur_voltage': 'Tensão atual',
                    'total_forward_energy': 'Energia total consumida',
                    'forward_energy_total': 'Energia acumulada',
                    'temp_current': 'Temperatura atual'
                };
                
                const metricDiv = document.createElement('div');
                metricDiv.className = 'bg-white p-3 rounded border text-center';
                metricDiv.innerHTML = `
                    <div class="${colorClass} text-2xl mb-1">
                        <i class="${icon}"></i>
                    </div>
                    <div class="text-xl font-bold ${colorClass}">${displayValue} ${unit}</div>
                    <div class="text-sm text-gray-500">${descriptions[energy.code] || energy.code}</div>
                `;
                
                energyMetrics.appendChild(metricDiv);
            });
        }

        function setupScheduling(deviceId) {
            currentDeviceId = deviceId; // Salvar o ID do dispositivo atual
            const checkinBtn = document.getElementById('schedule-checkin-btn');
            const checkoutBtn = document.getElementById('schedule-checkout-btn');
            const checkinTime = document.getElementById('checkin-time');
            const checkoutTime = document.getElementById('checkout-time');
            
            if (checkinBtn && checkinTime) {
                checkinBtn.addEventListener('click', () => {
                    scheduleCommand(deviceId, 'checkin', checkinTime.value, 'switch', true);
                });
            }
            
            if (checkoutBtn && checkoutTime) {
                checkoutBtn.addEventListener('click', () => {
                    scheduleCommand(deviceId, 'checkout', checkoutTime.value, 'switch', false);
                });
            }
            
            updateScheduledCommandsDisplay();
        }

        function scheduleCommand(deviceId, type, time, command, value) {
            const now = new Date();
            const [hours, minutes] = time.split(':');
            const scheduledTime = new Date();
            scheduledTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
            
            // Se o horário já passou hoje, agendar para amanhã
            if (scheduledTime <= now) {
                scheduledTime.setDate(scheduledTime.getDate() + 1);
            }
            
            const scheduledId = `${deviceId}-${type}-${Date.now()}`;
            const timeUntilExecution = scheduledTime.getTime() - now.getTime();
            
            const timeoutId = setTimeout(async () => {
                try {
                    log(`Executando comando agendado: ${type} às ${time}`);
                    await api.sendCommand(deviceId, command, value);
                    
                    if (type === 'checkout') {
                        // Para check-out, também configurar timer de 30 min
                        setTimeout(async () => {
                            await api.sendCommand(deviceId, 'countdown_1', 1800);
                        }, 2000);
                    }
                    
                    log(`Comando agendado executado com sucesso: ${type}`);
                    
                    // Remover da lista de agendamentos
                    scheduledCommands.delete(scheduledId);
                    updateScheduledCommandsDisplay();
                    
                } catch (error) {
                    logError(`Erro ao executar comando agendado ${type}`, error);
                }
            }, timeUntilExecution);
            
            // Armazenar o agendamento
            scheduledCommands.set(scheduledId, {
                deviceId,
                type,
                time,
                command,
                value,
                scheduledTime,
                timeoutId
            });
            
            log(`Comando agendado: ${type} para ${scheduledTime.toLocaleDateString()} às ${time}`);
            updateScheduledCommandsDisplay();
        }

        function updateScheduledCommandsDisplay() {
            const container = document.getElementById('scheduled-commands');
            if (!container) return;
            
            if (scheduledCommands.size === 0) {
                container.innerHTML = '<span class="text-gray-500">Nenhum agendamento ativo</span>';
                return;
            }
            
            const items = Array.from(scheduledCommands.values()).map(scheduled => {
                const timeStr = scheduled.scheduledTime.toLocaleDateString() + ' às ' + scheduled.time;
                const typeLabel = scheduled.type === 'checkin' ? 
                    '<i class="fas fa-sign-in-alt text-green-600 mr-1"></i>Check-in' : 
                    '<i class="fas fa-sign-out-alt text-orange-600 mr-1"></i>Check-out';
                
                return `
                    <div class="flex items-center justify-between py-1 border-b border-gray-200 last:border-b-0">
                        <span>${typeLabel}: ${timeStr}</span>
                        <button onclick="cancelScheduledCommand('${scheduled.scheduledTime.getTime()}')" 
                                class="text-red-600 hover:text-red-800 text-xs">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                `;
            }).join('');
            
            container.innerHTML = items;
        }

        function cancelScheduledCommand(timeKey) {
            for (const [id, scheduled] of scheduledCommands.entries()) {
                if (scheduled.scheduledTime.getTime().toString() === timeKey) {
                    clearTimeout(scheduled.timeoutId);
                    scheduledCommands.delete(id);
                    log(`Agendamento cancelado: ${scheduled.type}`);
                    updateScheduledCommandsDisplay();
                    break;
                }
            }
        }
